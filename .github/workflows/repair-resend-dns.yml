name: Owner-authorized Spaceship DNS repair
on:
  pull_request:
    paths:
      - 'scripts/apply_spaceship_resend_dns.mjs'
      - 'scripts/test_apply_spaceship_resend_dns.mjs'
      - 'scripts/repair_www_cname.mjs'
      - '.github/workflows/repair-resend-dns.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/repair_www_cname.mjs'
      - '.github/workflows/repair-resend-dns.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Plan reads DNS; apply adds only missing approved Resend records'
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
permissions:
  contents: read
concurrency:
  group: owner-dns-repair
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test safe append-only DNS repair
        run: node scripts/test_apply_spaceship_resend_dns.mjs

  www-cname-repair:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Enforce approved www CNAME for GitHub Pages
        env:
          SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
          SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
        run: node scripts/repair_www_cname.mjs
      - name: Verify public www HTTPS after DNS repair
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 5 --max-time 30 \
            https://www.ragunauthramsaroop.com/ --output /tmp/www-home.html
          grep -qi 'Ragunauth Ramsaroop' /tmp/www-home.html
          echo | openssl s_client -servername www.ragunauthramsaroop.com -connect www.ragunauthramsaroop.com:443 2>/dev/null \
            | openssl x509 -noout -checkend 604800
          echo "PASS: www HTTPS redirects successfully and the certificate is valid for at least seven days."

  owner-dns:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Inspect registrar DNS or apply four approved entries
        env:
          SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
          SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
          DNS_MODE: ${{ inputs.operation }}
        run: |
          if [ "$DNS_MODE" = "apply" ]; then
            node scripts/apply_spaceship_resend_dns.mjs --apply
          else
            node scripts/apply_spaceship_resend_dns.mjs
          fi
