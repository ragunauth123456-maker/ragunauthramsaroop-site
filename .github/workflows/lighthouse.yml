name: Lighthouse mobile and desktop
on:
  pull_request:
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'assets/**'
      - 'tools/assets/**'
      - 'search/**'
      - 'executive-profile/**'
      - 'research-library/**'
      - 'tools/**'
      - '.github/lighthouse/**'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
      - name: Audit representative public pages
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouse/lighthouserc-${{ matrix.mode }}.json
          uploadArtifacts: true
          temporaryPublicStorage: false
