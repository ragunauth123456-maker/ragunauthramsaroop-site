name: Guyana flagship publication PDF
on:
  push:
    branches: [research/guyana-petroleum-blueprint-2026]
    paths:
      - 'research-library/guyana-petroleum-blueprint-2026/*.md'
      - 'research-library/guyana-petroleum-blueprint-2026/*.csv'
      - 'research-library/guyana-petroleum-blueprint-2026/build_flagship_pdf.py'
      - '.github/workflows/guyana-flagship-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-flagship:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install 'reportlab>=4,<5' 'pymupdf>=1.26,<2'
      - name: Build and audit flagship
        run: python research-library/guyana-petroleum-blueprint-2026/build_flagship_pdf.py
      - name: Research integrity audit
        run: python research-library/guyana-petroleum-blueprint-2026/audit_research_integrity.py
      - name: Verify publication gate
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path("research-library/guyana-petroleum-blueprint-2026")
          a=json.loads((d/"FLAGSHIP_PDF_AUDIT.json").read_text())
          p=d/a["document"]
          assert a["pages_actual"]>=400
          assert a["source_records"]>=106
          assert a["publication_complete"] is False
          assert a["external_peer_review"]=="pending"
          assert a["political_ranking"]=="none"
          assert a["stage"]=="publication_candidate"
          assert a["tables_redesigned_for_readability"] is True
          assert a["internal_adversarial_audit"]=="completed_with_open_gates"
          assert a["searchable_text"] is True
          assert hashlib.sha256(p.read_bytes()).hexdigest()==a["sha256"]
          i=json.loads((d/"RESEARCH_INTEGRITY_AUDIT.json").read_text())
          assert i["source_records"]>=106
          assert i["source_ids_unique"] is True
          assert i["source_ids_sequential"] is True
          assert i["source_url_syntax_valid"] is True
          assert i["high_risk_claim_source_refs_valid"] is True
          assert i["high_risk_claims"]>=50
          assert i["legal_evidence_ledger_entries"]>=14
          assert i["corrections_register_entries"]>=16
          m=json.loads((d/"PUBLICATION_MANIFEST.json").read_text())
          assert m["edition"]=="1.2-scrutiny-candidate"
          assert m["integrity_audit_status"]=="passed"
          assert m["pdf_sha256"]==a["sha256"]
          print("PASS",json.dumps(a,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: guyana-petroleum-edition-1.2-scrutiny-candidate
          if-no-files-found: error
          path: |
            research-library/guyana-petroleum-blueprint-2026/guyana-petroleum-transformation-edition-1.2-scrutiny-candidate.pdf
            research-library/guyana-petroleum-blueprint-2026/FLAGSHIP_PDF_AUDIT.json
            research-library/guyana-petroleum-blueprint-2026/RESEARCH_INTEGRITY_AUDIT.json
            research-library/guyana-petroleum-blueprint-2026/ILLUSTRATIVE_SCENARIOS.csv
            research-library/guyana-petroleum-blueprint-2026/ILLUSTRATIVE_PRODUCTION_SHOCKS.csv
            research-library/guyana-petroleum-blueprint-2026/ILLUSTRATIVE_FUND_STRESS.csv
            research-library/guyana-petroleum-blueprint-2026/_flagship_preview_*.png
      - name: Commit audited flagship to research branch
        run: |
          set -e
          D="research-library/guyana-petroleum-blueprint-2026"
          TMP="$(mktemp -d)"
          cp "$D/guyana-petroleum-transformation-edition-1.2-scrutiny-candidate.pdf" "$TMP/"
          cp "$D/FLAGSHIP_PDF_AUDIT.json" "$TMP/"
          cp "$D/RESEARCH_INTEGRITY_AUDIT.json" "$TMP/"
          cp "$D/PUBLICATION_MANIFEST.json" "$TMP/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin research/guyana-petroleum-blueprint-2026
            git reset --hard origin/research/guyana-petroleum-blueprint-2026
            cp "$TMP/guyana-petroleum-transformation-edition-1.2-scrutiny-candidate.pdf" "$D/"
            cp "$TMP/FLAGSHIP_PDF_AUDIT.json" "$D/"
            cp "$TMP/RESEARCH_INTEGRITY_AUDIT.json" "$D/"
            cp "$TMP/PUBLICATION_MANIFEST.json" "$D/"
            git add "$D/guyana-petroleum-transformation-edition-1.2-scrutiny-candidate.pdf"
            git add "$D/FLAGSHIP_PDF_AUDIT.json"
            git add "$D/RESEARCH_INTEGRITY_AUDIT.json"
            git add "$D/PUBLICATION_MANIFEST.json"
            if git diff --cached --quiet; then
              echo "No artifact changes"
              exit 0
            fi
            git commit -m "research: publish scrutiny-hardened Guyana Edition 1.2 candidate [skip ci]"
            if git push origin HEAD:research/guyana-petroleum-blueprint-2026; then
              exit 0
            fi
            echo "Branch moved during publish, retrying ($attempt/3)"
            sleep 2
          done
          echo "Unable to publish audited artifact after retries"
          exit 1

