name: Public HTTPS and asset health
on:
  pull_request:
    paths:
      - '.github/workflows/tls-health.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tls-health.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  tls:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify DNS, HTTP redirect, HTTPS, homepage and critical assets
        shell: bash
        run: |
          set -euo pipefail
          for host in ragunauthramsaroop.com www.ragunauthramsaroop.com; do
            echo "Checking ${host}"

            echo "DNS for ${host}:"
            getent ahostsv4 "$host" | awk '{print $1}' | sort -u

            http_headers="/tmp/${host//./_}-http.headers"
            curl --silent --show-error --head --max-time 20 "http://${host}/" -o "$http_headers"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{print $2}' "$http_headers" | tr -d '\r' | tail -1)"
            test -n "$location"
            case "$location" in https://*) ;; *) echo "HTTP did not redirect to HTTPS: $location"; exit 1;; esac

            https_headers="/tmp/${host//./_}-https.headers"
            curl --fail --silent --show-error --head --location --retry 2 --retry-all-errors --retry-delay 3 --max-time 25 \
              "https://${host}/" -D "$https_headers" -o /dev/null
            echo "Security headers for ${host}:"
            grep -Ei '^(strict-transport-security|content-security-policy|x-content-type-options|referrer-policy):' "$https_headers" || true

            body="/tmp/${host//./_}.html"
            curl --fail --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 3 --max-time 25 \
              "https://${host}/" --output "$body"
            grep -qi 'Ragunauth Ramsaroop' "$body"

            css_path="/assets/site.css?v=20260928-2"
            css_body="/tmp/${host//./_}-next.css"
            css_headers="/tmp/${host//./_}-next.headers"
            curl --fail --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 3 --max-time 25 \
              -D "$css_headers" "https://${host}${css_path}" --output "$css_body"
            grep -Eqi '^content-type:[[:space:]]*text/css' "$css_headers"
            grep -q '.shell' "$css_body"

            for asset in /assets/site.css /assets/platform.css /tools/assets/launcher.css; do
              asset_name="$(basename "$asset")"
              asset_body="/tmp/${host//./_}-${asset_name}"
              asset_headers="/tmp/${host//./_}-${asset_name}.headers"
              curl --fail --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 3 --max-time 25 \
                -D "$asset_headers" "https://${host}${asset}" --output "$asset_body"
              grep -Eqi '^content-type:[[:space:]]*text/css' "$asset_headers"
              test -s "$asset_body"
            done

            echo "${host}: homepage and critical CSS assets returned valid CSS over HTTPS" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Warn when certificate expires within seven days
        shell: bash
        run: |
          set -euo pipefail
          for host in ragunauthramsaroop.com www.ragunauthramsaroop.com; do
            echo | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null \
              | openssl x509 -noout -checkend 604800
            echo "${host}: certificate valid for at least seven more days" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Open incident if public health check fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="[AUTO] Website availability incident"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Automated public health checks failed at $(date -u +'%Y-%m-%d %H:%M:%S UTC'). Check DNS, TLS, HTTP-to-HTTPS redirects, homepage content and critical assets. Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Health check failed again at $(date -u +'%Y-%m-%d %H:%M:%S UTC'). Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
      - name: Close automated incident after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="[AUTO] Website availability incident"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Automated public checks recovered at $(date -u +'%Y-%m-%d %H:%M:%S UTC')."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi
