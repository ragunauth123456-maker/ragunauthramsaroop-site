name: Executive white-paper preflight check

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/prepare_outreach_payload.py'
      - '.github/workflows/executive-whitepaper-preflight.yml'
      - '.github/workflows/icloud-smtp-outreach.yml'
      - 'outreach/EXECUTIVE_OUTREACH_POLICY.md'
      - 'outreach/templates/executive-company-whitepaper.example.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install preflight dependencies
        run: python -m pip install --disable-pip-version-check 'reportlab==4.2.5' 'pypdf==6.1.1'

      - name: Compile executive preflight
        run: python -m py_compile scripts/prepare_outreach_payload.py scripts/send_icloud_smtp.py

      - name: Validate policy template JSON
        run: python -m json.tool outreach/templates/executive-company-whitepaper.example.json > /dev/null
