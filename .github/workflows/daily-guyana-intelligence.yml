name: Daily Guyana Intelligence Refresh

on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-guyana-intelligence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install monitor dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Refresh public Guyana source snapshots
        run: python scripts/monitor_sources.py
      - name: Validate generated JSON
        run: |
          python -m json.tool data/source-monitor.json >/dev/null
          python -m json.tool data/guyana-live.json >/dev/null
          python -m json.tool api/v1/sources.json >/dev/null
          python -m json.tool api/v1/guyana.json >/dev/null
      - name: Commit refreshed public snapshots when changed
        run: |
          git add data/source-monitor.json data/guyana-live.json api/v1/sources.json api/v1/guyana.json
          if git diff --cached --quiet; then
            echo "No public snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh daily Guyana public intelligence snapshots"
          git push origin HEAD:main
