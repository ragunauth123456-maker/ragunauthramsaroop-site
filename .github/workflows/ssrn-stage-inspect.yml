name: SSRN Stage Inspect
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ssrn-stage-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSRN_EMAIL: ${{ secrets.SSRN_EMAIL }}
      SSRN_PASSWORD: ${{ secrets.SSRN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node scripts/ssrn-stage-inspect.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ssrn-stage-inspect
          if-no-files-found: ignore
          retention-days: 3
          path: ssrn-stage-inspect.png
