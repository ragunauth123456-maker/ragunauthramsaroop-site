name: Executive recipient audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/executive-recipient-audit.yml'
      - 'scripts/audit_executive_outreach.py'
      - 'outreach/icloud-staged/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit prior outreach recipients
        run: python scripts/audit_executive_outreach.py
