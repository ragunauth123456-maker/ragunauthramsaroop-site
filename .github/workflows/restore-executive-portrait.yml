name: Restore executive portrait
on:
  push:
    paths:
      - ".github/workflows/restore-executive-portrait.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and verify self-hosted portrait
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 \
            -A "Mozilla/5.0" \
            "https://ragunauth-ramsaroop.floot.app/_cdn/static/randy-portrait-web.jpg" \
            -o assets/randy-portrait.jpg
          test -s assets/randy-portrait.jpg
          file assets/randy-portrait.jpg | grep -Ei "JPEG|image"
          python - <<'PY'
          from pathlib import Path
          p=Path("assets/randy-portrait.jpg")
          b=p.read_bytes()
          if len(b)<10000 or b[:2]!=b"\xff\xd8":
              raise SystemExit("Portrait download is not a valid JPEG")
          print("portrait_bytes",len(b))
          PY
      - name: Commit self-hosted portrait and retire one-off workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/randy-portrait.jpg
          git rm .github/workflows/restore-executive-portrait.yml
          git commit -m "Restore self-hosted executive portrait"
          git push origin HEAD:main
