name: Refresh public search indexes

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'data/public-profile.json'
      - 'scripts/build_search_index.py'
      - 'scripts/build_pagefind_public.py'
      - 'scripts/build_semantic_index.mjs'
      - 'scripts/normalize_pagefind.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-search-index
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild lexical and Pagefind indexes
        run: npm run search:index
      - name: Rebuild semantic index
        run: npm run smart:index
      - name: Commit generated search assets when changed
        run: |
          git add assets/search-index.json assets/semantic-index.json pagefind
          if git diff --cached --quiet; then
            echo "Search indexes already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public search indexes from current site content"
          git push origin HEAD:main
